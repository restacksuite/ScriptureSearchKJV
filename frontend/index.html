<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripture for Purpose</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-amber-500/30">

    <!-- Vivid Luminous Cross Background Effect -->
    <div class="fixed inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-0">
        <!-- Outer Soft Radial Halo -->
        <div class="absolute w-[600px] h-[600px] bg-amber-400/15 rounded-full blur-3xl"></div>
        
        <!-- Vertical Beam of Light -->
        <div class="absolute w-24 sm:w-32 h-[85vh] bg-gradient-to-b from-amber-200/20 via-amber-300/40 to-amber-200/10 blur-xl rounded-full shadow-[0_0_80px_rgba(251,191,36,0.3)]"></div>
        
        <!-- Horizontal Crossbar (Wider and Brighter) -->
        <div class="absolute w-[500px] sm:w-[680px] h-20 sm:h-24 bg-gradient-to-r from-amber-200/10 via-amber-300/50 to-amber-200/10 blur-xl rounded-full shadow-[0_0_90px_rgba(251,191,36,0.35)]"></div>
        
        <!-- Bright Core Intersection -->
        <div class="absolute w-36 h-36 bg-amber-200/40 rounded-full blur-2xl"></div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="bg-stone-900/80 backdrop-blur-md border-b border-stone-800/80 sticky top-0 z-20">
        <div class="max-w-2xl mx-auto px-6 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-stone-100 text-stone-950 flex items-center justify-center font-serif font-bold text-base shadow-sm">
                    S
                </div>
                <div>
                    <h1 class="font-serif font-bold text-sm leading-none text-stone-100">Scripture for Purpose</h1>
                    <p class="text-[10px] text-stone-400 mt-0.5">Guidance, Wisdom & Local AI Engine</p>
                </div>
            </div>
            <span class="text-[11px] font-medium bg-amber-500/10 text-amber-300 border border-amber-500/20 px-2.5 py-0.5 rounded-full">
                31,102 Verses
            </span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8 space-y-6 relative z-10 flex flex-col justify-center">

        <!-- Search Box Card -->
        <section class="bg-stone-900/70 backdrop-blur-xl p-5 sm:p-6 rounded-2xl shadow-2xl border border-stone-700/70 space-y-4">
            
            <!-- Clear, Highly Visible Mode Tabs -->
            <div class="grid grid-cols-2 gap-1.5 p-1 bg-stone-950/80 rounded-xl border border-stone-800/80">
                <button type="button" id="tab-locations" onclick="setMode('locations')" 
                    class="py-2 px-3 rounded-lg text-xs font-semibold transition bg-stone-100 text-stone-950 shadow-sm cursor-pointer">
                    📍 Verse Locations
                </button>
                <button type="button" id="tab-discuss" onclick="setMode('discuss')" 
                    class="py-2 px-3 rounded-lg text-xs font-semibold transition text-stone-400 hover:text-stone-200 cursor-pointer">
                    📖 Full Passage View
                </button>
            </div>

            <form id="search-form" class="space-y-3.5">
                <div class="relative">
                    <textarea 
                        id="query" 
                        rows="2" 
                        placeholder="Describe a situation, feeling, or topic (e.g., 'Finding peace when worried')..." 
                        class="w-full p-3.5 rounded-xl bg-stone-950/90 border border-stone-700/80 text-stone-100 placeholder-stone-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400/50 focus:border-amber-400/50 resize-none shadow-inner"
                        required
                    ></textarea>
                </div>

                <!-- Quick Starter Prompts -->
                <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                    <span class="text-stone-400 font-medium">Try:</span>
                    <button type="button" onclick="quickSearch('Anxiety and worry about tomorrow')" class="px-2 py-0.5 rounded-md bg-stone-950/80 hover:bg-stone-800 text-stone-300 border border-stone-700/80 transition cursor-pointer">Anxiety & worry</button>
                    <button type="button" onclick="quickSearch('Forgiving someone who wronged me')" class="px-2 py-0.5 rounded-md bg-stone-950/80 hover:bg-stone-800 text-stone-300 border border-stone-700/80 transition cursor-pointer">Forgiveness</button>
                    <button type="button" onclick="quickSearch('Strength during difficult trials')" class="px-2 py-0.5 rounded-md bg-stone-950/80 hover:bg-stone-800 text-stone-300 border border-stone-700/80 transition cursor-pointer">Strength in trials</button>
                    <button type="button" onclick="quickSearch('Wisdom for making hard decisions')" class="px-2 py-0.5 rounded-md bg-stone-950/80 hover:bg-stone-800 text-stone-300 border border-stone-700/80 transition cursor-pointer">Wisdom</button>
                </div>

                <div class="pt-2 flex items-center justify-between border-t border-stone-800/80">
                    <p id="mode-helper" class="text-[11px] text-stone-400">
                        Click any verse to expand text.
                    </p>
                    <button type="submit" class="bg-amber-100 text-stone-950 px-5 py-2 rounded-xl text-xs font-semibold hover:bg-amber-200 active:scale-[0.99] transition cursor-pointer shadow-md shadow-amber-900/20">
                        Search Scripture
                    </button>
                </div>
            </form>
        </section>

        <!-- Results Container -->
        <section id="results" class="hidden space-y-3 pb-10"></section>

    </main>

    <script>
        // CHANGE THIS to your live Railway backend public URL once deployed
        const BACKEND_URL = "https://kjv-search-production.up.railway.app";

        let currentMode = "locations";

        function setMode(mode) {
            currentMode = mode;
            const tabLoc = document.getElementById("tab-locations");
            const tabDis = document.getElementById("tab-discuss");
            const helper = document.getElementById("mode-helper");

            if (mode === "locations") {
                tabLoc.className = "py-2 px-3 rounded-lg text-xs font-semibold transition bg-stone-100 text-stone-950 shadow-sm cursor-pointer";
                tabDis.className = "py-2 px-3 rounded-lg text-xs font-semibold transition text-stone-400 hover:text-stone-200 cursor-pointer";
                helper.textContent = "Click any verse to expand text.";
            } else {
                tabDis.className = "py-2 px-3 rounded-lg text-xs font-semibold transition bg-stone-100 text-stone-950 shadow-sm cursor-pointer";
                tabLoc.className = "py-2 px-3 rounded-lg text-xs font-semibold transition text-stone-400 hover:text-stone-200 cursor-pointer";
                helper.textContent = "Expanded reading cards with full scripture text.";
            }

            if (window.lastSearchData) {
                renderResults(window.lastSearchData);
            }
        }

        function quickSearch(text) {
            document.getElementById("query").value = text;
            document.getElementById("search-form").dispatchEvent(new Event("submit"));
        }

        function copyVerse(ref, text, btn) {
            navigator.clipboard.writeText(`${ref} - "${text}"`);
            const original = btn.textContent;
            btn.textContent = "Copied!";
            btn.classList.add("text-emerald-400");
            setTimeout(() => {
                btn.textContent = original;
                btn.classList.remove("text-emerald-400");
            }, 1500);
        }

        document.getElementById("search-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const query = document.getElementById("query").value;
            const resultsDiv = document.getElementById("results");

            resultsDiv.classList.remove("hidden");
            resultsDiv.innerHTML = `
                <div class="bg-stone-900/70 backdrop-blur-xl p-6 rounded-2xl border border-stone-700/70 text-center space-y-2 shadow-xl">
                    <div class="inline-block w-4 h-4 border-2 border-amber-300 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-stone-400 text-xs">Searching semantic meaning across 31,102 verses...</p>
                </div>
            `;

            try {
                const response = await fetch(`${BACKEND_URL}/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query, top_k: 5 })
                });
                const data = await response.json();
                window.lastSearchData = data;
                renderResults(data);
            } catch (err) {
                resultsDiv.innerHTML = `
                    <div class="bg-stone-900/70 backdrop-blur-xl p-6 rounded-2xl border border-red-500/30 text-center space-y-2 shadow-xl">
                        <p class="text-red-400 text-xs font-medium">Unable to connect to backend server. Please check your network or API status.</p>
                    </div>
                `;
            }
        });

        function renderResults(data) {
            const resultsDiv = document.getElementById("results");
            let html = `
                <div class="flex items-center justify-between px-1 pt-2">
                    <h2 class="text-[11px] font-semibold uppercase tracking-wider text-stone-400">Top Conceptual Matches</h2>
                    <span class="text-[11px] text-stone-400">Sorted by semantic relevance</span>
                </div>
            `;
            
            data.results.forEach(item => {
                const matchPercent = (item.score * 100).toFixed(1);
                const safeText = item.text.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const reference = `${item.book} ${item.chapter}:${item.verse}`;

                if (currentMode === "locations") {
                    html += `
                        <details class="group bg-stone-900/80 backdrop-blur-xl rounded-xl shadow-lg border border-stone-700/70 overflow-hidden transition">
                            <summary class="p-3.5 cursor-pointer flex items-center justify-between hover:bg-stone-800/60 transition list-none">
                                <div class="flex items-center gap-2.5">
                                    <span class="text-amber-300 group-open:rotate-90 transition-transform text-[10px]">▶</span>
                                    <span class="font-serif font-bold text-stone-100 text-sm">${reference}</span>
                                </div>
                                <span class="text-[11px] bg-stone-950 text-amber-300 border border-stone-700/80 px-2 py-0.5 rounded-full font-medium">
                                    ${matchPercent}% match
                                </span>
                            </summary>
                            <div class="px-4 pb-4 pt-1.5 border-t border-stone-800/80 bg-stone-950/40 space-y-2.5">
                                <p class="text-stone-200 text-sm font-serif leading-relaxed">${item.text}</p>
                                <div class="flex justify-end">
                                    <button type="button" onclick="copyVerse('${reference}', '${safeText}', this)" 
                                        class="text-[11px] font-medium text-stone-400 hover:text-amber-300 transition cursor-pointer">
                                        Copy Verse
                                    </button>
                                </div>
                            </div>
                        </details>
                    `;
                } else {
                    html += `
                        <div class="bg-stone-900/80 backdrop-blur-xl p-4.5 rounded-xl shadow-lg border border-stone-700/70 space-y-2.5">
                            <div class="flex items-center justify-between">
                                <span class="font-serif font-bold text-sm text-stone-100">${reference}</span>
                                <span class="text-[11px] bg-stone-950 text-amber-300 border border-stone-700/80 px-2 py-0.5 rounded-full font-medium">
                                    ${matchPercent}% match
                                </span>
                            </div>
                            <p class="text-stone-200 text-sm font-serif leading-relaxed">${item.text}</p>
                            <div class="pt-1.5 border-t border-stone-800/80 flex justify-end">
                                <button type="button" onclick="copyVerse('${reference}', '${safeText}', this)" 
                                    class="text-[11px] font-medium text-stone-400 hover:text-amber-300 transition cursor-pointer">
                                    Copy Verse
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
